apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-management-harness
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-management-harness
  template:
    metadata:
      labels:
        app: student-management-harness
    spec:
      containers:
        - name: web
          image: tumenta3322/student-management:jenkins-7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
