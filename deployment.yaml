apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-management
spec:
  replicas: 3
  selector:
    matchLabels:
      app: student-management
  template:
    metadata:
      labels:
        app: student-management
    spec:
      containers:
        - name: web
          image: student-management:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http